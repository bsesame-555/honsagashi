<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本探し</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f0; color: #222; min-height: 100vh; padding: 2rem 1rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 2rem; }
  .search-box { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.25rem; margin-bottom: 1.5rem; }
  .search-row { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; padding: 10px 14px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
  input[type="text"]:focus { border-color: #888; }
  button.search-btn { padding: 10px 20px; background: #222; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; white-space: nowrap; }
  button.search-btn:hover { background: #444; }
  .results { display: flex; flex-direction: column; gap: 1rem; }
  .section { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; overflow: hidden; }
  .section-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid #eee; }
  .priority { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .p1 { background: #e8f5e9; color: #2e7d32; }
  .p2 { background: #e3f2fd; color: #1565c0; }
  .p3 { background: #fce4ec; color: #880e4f; }
  .p4 { background: #fff3e0; color: #e65100; }
  .section-title { font-size: 15px; font-weight: 500; }
  .section-body { padding: 14px 16px; }
  .link-btn { display: inline-block; padding: 9px 18px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; color: #222; text-decoration: none; background: #fafafa; margin-right: 8px; margin-bottom: 8px; }
  .link-btn:hover { background: #f0f0f0; border-color: #999; }
  .link-btn.primary { background: #222; color: #fff; border-color: #222; }
  .link-btn.primary:hover { background: #444; }
  .loading { color: #888; font-size: 14px; padding: 8px 0; }
  .hint { font-size: 13px; color: #aaa; padding: 0 0 10px 0; }
  .book-title { font-size: 16px; font-weight: 500; }
  .book-author { font-size: 13px; color: #888; margin-top: 2px; }
  .book-isbn { font-size: 12px; color: #aaa; margin-top: 2px; }
</style>
</head>
<body>

<h1>本探し</h1>
<p class="subtitle">書名を入力して、書店・図書館・通販をまとめて調べます</p>

<div class="search-box">
  <div class="search-row">
    <input type="text" id="bookInput" placeholder="書名を入力（例：嫌われる勇気）" />
    <button class="search-btn" onclick="search()">探す</button>
  </div>
</div>

<div class="results" id="results"></div>

<script>
const CALIL_KEY = '2f3e4e759bdd7d5374e3bf29d4a36d98';

document.getElementById('bookInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

function encodeQ(s) { return encodeURIComponent(s); }

async function search() {
  const q = document.getElementById('bookInput').value.trim();
  if (!q) return;

  document.getElementById('results').innerHTML = `
    <div class="section"><div class="section-body"><p class="loading">書誌情報を検索中...</p></div></div>
  `;

  let isbn = null;
  let bookInfo = null;

  try {
    const res = await fetch(`https://ndlsearch.ndl.go.jp/api/opensearch?title=${encodeQ(q)}&cnt=1&mediatype=1`);
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const item = xml.querySelector('item');
    if (item) {
      const title = item.querySelector('title')?.textContent || q;
      const author = item.querySelector('author')?.textContent || '';
      const isbnEl = [...xml.querySelectorAll('identifier')].find(el => el.getAttribute('type') === 'dcndl:ISBN');
      isbn = isbnEl ? isbnEl.textContent.replace(/-/g, '') : null;
      bookInfo = { title, author, isbn };
    }
  } catch(e) {}

  document.getElementById('results').innerHTML = `
    ${bookInfo ? makeBookInfo(bookInfo) : ''}
    ${makeSection('① e-hon（書店取り寄せ）', 'p1', ehonHTML(q, isbn))}
    ${makeSection('② カーリル（図書館）', 'p2', '<p class="loading" id="calilLoading">図書館を検索中...</p><div id="calilResult"></div>')}
    ${makeSection('③ 楽天ブックス', 'p3', rakutenHTML(q))}
    ${makeSection('④ Amazon Kindle', 'p4', kindleHTML(q))}
  `;

  if (isbn) searchCalil(isbn);
  else {
    document.getElementById('calilLoading').style.display = 'none';
    document.getElementById('calilResult').innerHTML = `<a class="link-btn" href="https://calil.jp/search?q=${encodeQ(q)}" target="_blank">カーリルで検索 →</a>`;
  }
}

function makeBookInfo(info) {
  return `
    <div class="section">
      <div class="section-body">
        <div class="book-title">${info.title}</div>
        ${info.author ? `<div class="book-author">${info.author}</div>` : ''}
        ${info.isbn ? `<div class="book-isbn">ISBN: ${info.isbn}</div>` : ''}
      </div>
    </div>
  `;
}

function makeSection(title, priority, body) {
  return `
    <div class="section">
      <div class="section-header">
        <span class="priority ${priority}">${title.charAt(0)}</span>
        <span class="section-title">${title}</span>
      </div>
      <div class="section-body">${body}</div>
    </div>
  `;
}

function ehonHTML(q, isbn) {
  const isbnUrl = isbn ? `https://www.e-hon.ne.jp/bec/SA/Detail?refShinCode=${isbn}` : null;
  const searchUrl = `https://www.e-hon.ne.jp/bec/SA/Search?tab=normal&mode=title&keyword=${encodeQ(q)}`;
  return `
    <p class="hint">e-honで在庫確認→近くの書店で取り寄せ</p>
    ${isbnUrl ? `<a class="link-btn primary" href="${isbnUrl}" target="_blank">e-honで直接開く →</a>` : ''}
    <a class="link-btn" href="${searchUrl}" target="_blank">e-honで書名検索 →</a>
  `;
}

function rakutenHTML(q) {
  return `<a class="link-btn" href="https://books.rakuten.co.jp/search?sitem=${encodeQ(q)}" target="_blank">楽天ブックスで検索 →</a>`;
}

function kindleHTML(q) {
  return `<a class="link-btn" href="https://www.amazon.co.jp/s?k=${encodeQ(q)}&i=digital-text" target="_blank">Kindleで検索 →</a>`;
}

let pollCount = 0;
function searchCalil(isbn) {
  pollCount = 0;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const apiUrl = `https://api.calil.jp/library?appkey=${CALIL_KEY}&lat=${lat}&lng=${lng}&limit=5&callback=calilLibCallback`;
    window.calilLibCallback = function(libs) {
      if (!libs || libs.length === 0) {
        document.getElementById('calilLoading').textContent = '近くの図書館が見つかりませんでした';
        return;
      }
      const systemids = [...new Set(libs.map(l => l.systemid))].join(',');
      window.calilLibs = libs;
      loadScript(`https://api.calil.jp/check?appkey=${CALIL_KEY}&isbn=${isbn}&systemid=${systemids}&format=json&callback=calilCheckCallback`);
    };
    loadScript(apiUrl);
  }, () => {
    document.getElementById('calilLoading').style.display = 'none';
    document.getElementById('calilResult').innerHTML = `<a class="link-btn" href="https://calil.jp/book/${isbn}" target="_blank">カーリルで確認 →</a>`;
  });
}

window.calilCheckCallback = function(data) {
  document.getElementById('calilLoading').style.display = 'none';
  if (data.continue == 1) {
    document.getElementById('calilResult').innerHTML = '<p class="loading">蔵書を確認中...</p>';
    setTimeout(() => pollCalil(data.session), 2000);
  } else {
    renderCalil(data);
  }
};

function pollCalil(session) {
  pollCount++;
  if (pollCount > 10) { renderCalil(null); return; }
  const cb = 'calilPoll_' + pollCount;
  window[cb] = function(data) {
    if (data.continue == 1) setTimeout(() => pollCalil(data.session), 2000);
    else renderCalil(data);
  };
  loadScript(`https://api.calil.jp/check?appkey=${CALIL_KEY}&session=${session}&format=json&callback=${cb}`);
}

function renderCalil(data) {
  const container = document.getElementById('calilResult');
  const libs = window.calilLibs || [];
  if (!data || !data.books || data.books.length === 0) {
    container.innerHTML = '<p class="hint">蔵書情報を取得できませんでした</p>';
    return;
  }
  const book = data.books[0];
  let html = '';
  libs.forEach(lib => {
    const sysid = lib.systemid;
    const libid = lib.libid;
    if (!book[sysid]) return;
    const libData = book[sysid];
    const avail = libData.libkey && libData.libkey[libid];
    let statusText = '不明', statusStyle = 'background:#f5f5f5;color:#888;';
    if (avail === '貸出可' || avail === '蔵書あり') { statusText = avail; statusStyle = 'background:#e8f5e9;color:#2e7d32;'; }
    else if (avail) { statusText = avail; statusStyle = 'background:#fce4ec;color:#c62828;'; }
    else if (libData.status === 'Error') { statusText = '蔵書なし'; statusStyle = 'background:#fce4ec;color:#c62828;'; }
    const reserveUrl = libData.reserveurl || `https://calil.jp/book/${document.getElementById('bookInput').value}`;
    html += `<div style="padding:8px 0;border-bottom:0.5px solid #f0f0f0;">
      <div style="font-weight:500;font-size:14px;">${lib.formal}</div>
      <span style="font-size:12px;padding:2px 8px;border-radius:4px;${statusStyle}">${statusText}</span>
      ${statusText === '貸出可' || statusText === '蔵書あり' ? `<a href="${reserveUrl}" target="_blank" style="font-size:12px;color:#1565c0;margin-left:8px;">予約 →</a>` : ''}
    </div>`;
  });
  container.innerHTML = html || '<p class="hint">近くの図書館に蔵書がありませんでした</p>';
}

function loadScript(url) {
  const s = document.createElement('script');
  s.src = url;
  document.body.appendChild(s);
}
</script>
</body>
</html>
